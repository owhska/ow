[package]
name = "ow"
version = "0.1.0"
edition = "2024"
description = "Micro GNU Emacs clone in Rust with built-in git and wide syntax highlighting"
license = "Unlicense"

[[bin]]
name = "ow"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
git2 = { version = "0.21", features = ["cred"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
unicode-width = "0.2"
regex = "1"
arboard = "3"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
